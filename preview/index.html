<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FirstSynth Preview</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f6f7f9;
            --panel: #ffffff;
            --text: #15171a;
            --muted: #626a73;
            --line: #d7dce2;
            --accent: #146c63;
            --accent-strong: #0d4f49;
            --danger: #a33a34;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font: 15px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            width: min(920px, calc(100% - 32px));
            margin: 0 auto;
            padding: 32px 0;
        }

        header {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 28px;
            line-height: 1.1;
            letter-spacing: 0;
        }

        .status {
            color: var(--muted);
            font-size: 14px;
            min-height: 20px;
            text-align: right;
        }

        .surface {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(18, 24, 31, 0.08);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
        }

        .control {
            display: grid;
            gap: 8px;
        }

        label {
            color: var(--muted);
            font-size: 13px;
            font-weight: 600;
        }

        input,
        select,
        button {
            font: inherit;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
        }

        input[type="number"],
        select {
            width: 100%;
            height: 40px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: white;
            color: var(--text);
            padding: 0 10px;
        }

        .value-row {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 12px;
        }

        .readout {
            min-width: 72px;
            color: var(--text);
            font-variant-numeric: tabular-nums;
            text-align: right;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            min-height: 42px;
            border: 1px solid transparent;
            border-radius: 6px;
            padding: 0 14px;
            cursor: pointer;
            font-weight: 650;
        }

        .primary {
            background: var(--accent);
            color: white;
        }

        .primary:hover {
            background: var(--accent-strong);
        }

        .secondary {
            background: white;
            border-color: var(--line);
            color: var(--text);
        }

        .secondary:hover {
            border-color: var(--accent);
        }

        .danger {
            background: white;
            border-color: #e2b7b4;
            color: var(--danger);
        }

        .meter {
            height: 12px;
            margin-top: 20px;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: #eef1f4;
        }

        .meter-fill {
            width: 20%;
            height: 100%;
            background: linear-gradient(90deg, #2e8b57, #d1a336, #b94740);
            transform-origin: left center;
        }

        .notes {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
            margin-top: 16px;
        }

        .note {
            background: #fbfcfd;
            border-color: var(--line);
        }

        @media (max-width: 720px) {
            header {
                align-items: start;
                flex-direction: column;
            }

            .status {
                text-align: left;
            }

            .grid,
            .notes {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>FirstSynth Preview</h1>
            <div class="status" id="status">Audio idle</div>
        </header>

        <section class="surface" aria-label="Synth controls">
            <div class="grid">
                <div class="control">
                    <label for="waveform">Waveform</label>
                    <select id="waveform">
                        <option value="sine" selected>Sine</option>
                        <option value="triangle">Triangle</option>
                        <option value="sawtooth">Saw</option>
                        <option value="square">Square</option>
                    </select>
                </div>

                <div class="control">
                    <label for="frequency">Frequency</label>
                    <div class="value-row">
                        <input id="frequency" type="range" min="40" max="1200" step="1" value="220">
                        <span class="readout" id="frequencyReadout">220 Hz</span>
                    </div>
                    <input id="frequencyNumber" type="number" min="20" max="5000" step="1" value="220">
                </div>

                <div class="control">
                    <label for="gain">Gain</label>
                    <div class="value-row">
                        <input id="gain" type="range" min="0" max="0.8" step="0.01" value="0.2">
                        <span class="readout" id="gainReadout">0.20</span>
                    </div>
                </div>
            </div>

            <div class="notes" aria-label="Quick notes">
                <button class="note" data-note="110">A2</button>
                <button class="note" data-note="220">A3</button>
                <button class="note" data-note="440">A4</button>
                <button class="note" data-note="880">A5</button>
            </div>

            <div class="actions">
                <button class="primary" id="trigger">Trigger</button>
                <button class="secondary" id="hold">Hold</button>
                <button class="danger" id="stop">Stop</button>
            </div>

            <div class="meter" aria-label="Output gain meter">
                <div class="meter-fill" id="meterFill"></div>
            </div>
        </section>
    </main>

    <script>
        const state = {
            audio: null,
            heldOsc: null,
            heldGain: null,
            isHeld: false,
        };

        const els = {
            waveform: document.querySelector("#waveform"),
            frequency: document.querySelector("#frequency"),
            frequencyNumber: document.querySelector("#frequencyNumber"),
            frequencyReadout: document.querySelector("#frequencyReadout"),
            gain: document.querySelector("#gain"),
            gainReadout: document.querySelector("#gainReadout"),
            trigger: document.querySelector("#trigger"),
            hold: document.querySelector("#hold"),
            stop: document.querySelector("#stop"),
            status: document.querySelector("#status"),
            meterFill: document.querySelector("#meterFill"),
            notes: document.querySelectorAll("[data-note]"),
        };

        function getAudio() {
            if(!state.audio) {
                state.audio = new AudioContext();
            }
            return state.audio;
        }

        function params() {
            return {
                waveform: els.waveform.value,
                frequency: Number(els.frequencyNumber.value),
                gain: Number(els.gain.value),
            };
        }

        function syncReadouts() {
            const frequency = Number(els.frequencyNumber.value);
            const gain = Number(els.gain.value);

            els.frequency.value = String(Math.max(40, Math.min(1200, frequency)));
            els.frequencyReadout.textContent = `${frequency.toFixed(0)} Hz`;
            els.gainReadout.textContent = gain.toFixed(2);
            els.meterFill.style.width = `${Math.min(100, gain * 125)}%`;

            if(state.isHeld && state.heldOsc && state.heldGain) {
                const audio = getAudio();
                state.heldOsc.type = els.waveform.value;
                state.heldOsc.frequency.setTargetAtTime(frequency, audio.currentTime, 0.01);
                state.heldGain.gain.setTargetAtTime(gain, audio.currentTime, 0.01);
            }
        }

        function createVoice(audio, frequency, waveform, gain) {
            const osc = audio.createOscillator();
            const amp = audio.createGain();

            osc.type = waveform;
            osc.frequency.value = frequency;
            amp.gain.value = 0;

            osc.connect(amp);
            amp.connect(audio.destination);
            osc.start();

            return { osc, amp };
        }

        async function triggerSound(duration = 0.5) {
            const audio = getAudio();
            await audio.resume();

            const { frequency, waveform, gain } = params();
            const { osc, amp } = createVoice(audio, frequency, waveform, gain);
            const now = audio.currentTime;

            amp.gain.cancelScheduledValues(now);
            amp.gain.setValueAtTime(0, now);
            amp.gain.linearRampToValueAtTime(gain, now + 0.01);
            amp.gain.setValueAtTime(gain, now + Math.max(0.02, duration - 0.08));
            amp.gain.linearRampToValueAtTime(0, now + duration);
            osc.stop(now + duration + 0.02);

            els.status.textContent = `Triggered ${frequency.toFixed(0)} Hz ${waveform}`;
        }

        async function toggleHold() {
            if(state.isHeld) {
                stopHeld();
                return;
            }

            const audio = getAudio();
            await audio.resume();

            const { frequency, waveform, gain } = params();
            const { osc, amp } = createVoice(audio, frequency, waveform, gain);
            const now = audio.currentTime;

            amp.gain.setValueAtTime(0, now);
            amp.gain.linearRampToValueAtTime(gain, now + 0.02);

            state.heldOsc = osc;
            state.heldGain = amp;
            state.isHeld = true;
            els.hold.textContent = "Release";
            els.status.textContent = `Holding ${frequency.toFixed(0)} Hz ${waveform}`;
        }

        function stopHeld() {
            if(!state.isHeld || !state.heldOsc || !state.heldGain) {
                return;
            }

            const audio = getAudio();
            const now = audio.currentTime;
            state.heldGain.gain.cancelScheduledValues(now);
            state.heldGain.gain.setTargetAtTime(0, now, 0.02);
            state.heldOsc.stop(now + 0.15);

            state.heldOsc = null;
            state.heldGain = null;
            state.isHeld = false;
            els.hold.textContent = "Hold";
            els.status.textContent = "Audio idle";
        }

        els.frequency.addEventListener("input", () => {
            els.frequencyNumber.value = els.frequency.value;
            syncReadouts();
        });

        els.frequencyNumber.addEventListener("input", syncReadouts);
        els.gain.addEventListener("input", syncReadouts);
        els.waveform.addEventListener("change", syncReadouts);
        els.trigger.addEventListener("click", () => triggerSound());
        els.hold.addEventListener("click", toggleHold);
        els.stop.addEventListener("click", stopHeld);

        els.notes.forEach((button) => {
            button.addEventListener("click", () => {
                els.frequencyNumber.value = button.dataset.note;
                syncReadouts();
                triggerSound();
            });
        });

        syncReadouts();
    </script>
</body>
</html>
