<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kicki Danielsson Preview</title>
    <link rel="stylesheet" href="kicki.css">
</head>
<body>
    <main>
        <header>
            <h1>Kicki Danielsson</h1>
            <div class="status" id="status">Ready</div>
        </header>

        <section class="surface" aria-label="Bassdrum controls">
            <div class="section-heading">Basic Settings</div>
            <div class="grid">
                <div class="control">
                    <label for="baseFreq">Base pitch</label>
                    <div class="value-row">
                        <input id="baseFreq" type="range" min="32" max="90" step="1" value="48">
                        <span class="readout" id="baseFreqReadout">48 Hz</span>
                    </div>
                </div>

                <div class="control">
                    <label for="pitchAmount">Pitch drop</label>
                    <div class="value-row">
                        <input id="pitchAmount" type="range" min="0" max="220" step="1" value="112">
                        <span class="readout" id="pitchAmountReadout">112 Hz</span>
                    </div>
                </div>

                <div class="control">
                    <label for="pitchDecay">Pitch decay</label>
                    <div class="value-row">
                        <input id="pitchDecay" type="range" min="0.01" max="0.25" step="0.005" value="0.055">
                        <span class="readout" id="pitchDecayReadout">55 ms</span>
                    </div>
                </div>

                <div class="control">
                    <label for="ampDecay">Body decay</label>
                    <div class="value-row">
                        <input id="ampDecay" type="range" min="0.05" max="1.2" step="0.01" value="0.36">
                        <span class="readout" id="ampDecayReadout">360 ms</span>
                    </div>
                </div>

                <div class="control">
                    <label for="cutoff">Lowpass cutoff</label>
                    <div class="value-row">
                        <input id="cutoff" type="range" min="80" max="3000" step="10" value="760">
                        <span class="readout" id="cutoffReadout">760 Hz</span>
                    </div>
                </div>

                <div class="control">
                    <label for="resonance">Resonance</label>
                    <div class="value-row">
                        <input id="resonance" type="range" min="0" max="1" step="0.01" value="0.62">
                        <span class="readout" id="resonanceReadout">0.62</span>
                    </div>
                </div>

                <div class="control">
                    <label for="gain">Output gain</label>
                    <div class="value-row">
                        <input id="gain" type="range" min="0" max="1" step="0.01" value="0.7">
                        <span class="readout" id="gainReadout">0.70</span>
                    </div>
                </div>

            </div>

            <div class="actions">
                <button class="primary" id="trigger">Trigger</button>
                <button class="secondary" id="repeat">Repeat</button>
                <button class="secondary" id="tapTempo">Tap Tempo</button>
                <button class="danger" id="stop">Stop</button>
                <span class="tempo-readout" id="tempoReadout">80 BPM</span>
            </div>

            <div class="tempo-control" aria-label="Manual BPM control">
                <input id="bpm" type="range" min="30" max="300" step="1" value="80">
                <input id="bpmNumber" type="number" min="30" max="300" step="1" value="80">
            </div>

            <div class="firmware-output" aria-label="Firmware values">
                <textarea id="firmwareValues" spellcheck="false" readonly></textarea>
                <div class="firmware-actions">
                    <button class="secondary" id="printValues">Print Firmware Values</button>
                    <button class="secondary" id="copyValues">Copy Values</button>
                </div>
                <div class="firmware-note">These are the constants to put in src/kicki.cpp before building and flashing the Daisy Seed.</div>
            </div>

            <div class="vu" aria-label="Output VU meter">
                <div class="vu-header">
                    <span>VU</span>
                    <span class="vu-readout" id="vuReadout">-inf dB</span>
                </div>
                <div class="vu-bar">
                    <div class="vu-fill" id="vuFill"></div>
                    <div class="vu-peak" id="vuPeak"></div>
                </div>
            </div>

            <div class="memory" aria-label="Daisy Seed memory usage">
                <div class="memory-header">
                    <span>Daisy Seed Memory Snapshot</span>
                    <span class="memory-time" id="memoryTime">No report</span>
                </div>
                <div class="memory-grid" id="memoryGrid"></div>
                <div class="memory-note">Refresh after firmware changes: python tools/update_memory_report.py</div>
            </div>
        </section>
    </main>

    <script src="memory-report.js"></script>
    <script>
        const STORAGE_KEY = "kicki-danielsson-preview-v1";

        const state = {
            audio: null,
            master: null,
            analyser: null,
            meterFrame: null,
            meterData: null,
            vuLevel: 0,
            repeatTimer: null,
            repeatMs: 750,
            tapTimes: [],
        };

        const controls = {
            baseFreq: document.querySelector("#baseFreq"),
            pitchAmount: document.querySelector("#pitchAmount"),
            pitchDecay: document.querySelector("#pitchDecay"),
            ampDecay: document.querySelector("#ampDecay"),
            cutoff: document.querySelector("#cutoff"),
            resonance: document.querySelector("#resonance"),
            gain: document.querySelector("#gain"),
            bpm: document.querySelector("#bpm"),
            bpmNumber: document.querySelector("#bpmNumber"),
        };

        const els = {
            status: document.querySelector("#status"),
            trigger: document.querySelector("#trigger"),
            repeat: document.querySelector("#repeat"),
            tapTempo: document.querySelector("#tapTempo"),
            printValues: document.querySelector("#printValues"),
            copyValues: document.querySelector("#copyValues"),
            stop: document.querySelector("#stop"),
            tempoReadout: document.querySelector("#tempoReadout"),
            firmwareValues: document.querySelector("#firmwareValues"),
            vuFill: document.querySelector("#vuFill"),
            vuPeak: document.querySelector("#vuPeak"),
            vuReadout: document.querySelector("#vuReadout"),
            memoryGrid: document.querySelector("#memoryGrid"),
            memoryTime: document.querySelector("#memoryTime"),
        };

        function getAudio() {
            if(!state.audio) {
                state.audio = new AudioContext();
                state.master = state.audio.createGain();
                state.analyser = state.audio.createAnalyser();
                state.analyser.fftSize = 1024;
                state.meterData = new Float32Array(state.analyser.fftSize);

                state.master.connect(state.analyser);
                state.analyser.connect(state.audio.destination);

                startVuMeter();
            }
            return state.audio;
        }

        function startVuMeter() {
            if(state.meterFrame) {
                return;
            }

            const tick = () => {
                let rms = 0;
                let peak = 0;

                if(state.analyser) {
                    state.analyser.getFloatTimeDomainData(state.meterData);

                    for(const sample of state.meterData) {
                        const abs = Math.abs(sample);
                        rms += sample * sample;
                        peak = Math.max(peak, abs);
                    }

                    rms = Math.sqrt(rms / state.meterData.length);
                }

                state.vuLevel = Math.max(rms, state.vuLevel * 0.9);

                const vuPercent = Math.min(100, state.vuLevel * 170);
                const peakPercent = Math.min(100, peak * 100);
                const db = rms > 0.0001 ? `${(20 * Math.log10(rms)).toFixed(1)} dB` : "-inf dB";

                els.vuFill.style.width = `${vuPercent}%`;
                els.vuPeak.style.left = `${peakPercent}%`;
                els.vuReadout.textContent = db;

                state.meterFrame = requestAnimationFrame(tick);
            };

            state.meterFrame = requestAnimationFrame(tick);
        }

        function value(id) {
            return Number(controls[id].value);
        }

        function clamp(valueToClamp, min, max) {
            return Math.max(min, Math.min(max, valueToClamp));
        }

        function bpmFromRepeatMs() {
            return Math.round(60000 / state.repeatMs);
        }

        function currentSettings() {
            return {
                baseFreq: value("baseFreq"),
                pitchAmount: value("pitchAmount"),
                pitchDecay: value("pitchDecay"),
                ampDecay: value("ampDecay"),
                cutoff: value("cutoff"),
                resonance: value("resonance"),
                gain: value("gain"),
                bpm: bpmFromRepeatMs(),
            };
        }

        function saveSettings() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(currentSettings()));
        }

        function setBpm(bpm, shouldRestart = true, preserveTapHistory = false) {
            const clamped = clamp(Math.round(bpm), 30, 300);
            state.repeatMs = 60000 / clamped;
            controls.bpm.value = String(clamped);
            controls.bpmNumber.value = String(clamped);

            if(!preserveTapHistory) {
                state.tapTimes = [];
            }

            if(shouldRestart) {
                restartRepeatIfRunning();
            }

            updateReadouts();
            updateFirmwareValues();
            saveSettings();
        }

        function loadSettings() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if(!stored) {
                return;
            }

            try {
                const settings = JSON.parse(stored);
                const mappings = {
                    baseFreq: "baseFreq",
                    pitchAmount: "pitchAmount",
                    pitchDecay: "pitchDecay",
                    ampDecay: "ampDecay",
                    cutoff: "cutoff",
                    resonance: "resonance",
                    gain: "gain",
                };

                Object.entries(mappings).forEach(([key, control]) => {
                    if(typeof settings[key] === "number") {
                        controls[control].value = String(settings[key]);
                    }
                });

                if(typeof settings.bpm === "number") {
                    setBpm(settings.bpm, false, true);
                }
            } catch(error) {
                localStorage.removeItem(STORAGE_KEY);
            }
        }

        function firmwareValueText() {
            const settings = currentSettings();

            return [
                "constexpr float kBaseFreqHz       = " + settings.baseFreq.toFixed(1) + "f;",
                "constexpr float kPitchAmountHz    = " + settings.pitchAmount.toFixed(1) + "f;",
                "constexpr float kPitchDecaySec    = " + settings.pitchDecay.toFixed(3) + "f;",
                "constexpr float kAmpDecaySec      = " + settings.ampDecay.toFixed(3) + "f;",
                "constexpr float kLowpassCutoffHz  = " + settings.cutoff.toFixed(1) + "f;",
                "constexpr float kResonance        = " + settings.resonance.toFixed(2) + "f;",
                "constexpr float kOutputGain       = " + settings.gain.toFixed(2) + "f;",
            ].join("\n");
        }

        function updateFirmwareValues() {
            els.firmwareValues.value = firmwareValueText();
        }

        function printFirmwareValues() {
            updateFirmwareValues();
            els.firmwareValues.focus();
            els.firmwareValues.select();
            els.status.textContent = "Firmware values printed";
        }

        async function copyFirmwareValues() {
            updateFirmwareValues();

            try {
                await navigator.clipboard.writeText(els.firmwareValues.value);
                els.status.textContent = "Firmware values copied";
            } catch(error) {
                els.firmwareValues.focus();
                els.firmwareValues.select();
                els.status.textContent = "Select and copy the firmware values";
            }
        }

        function updateReadouts() {
            document.querySelector("#baseFreqReadout").textContent = `${value("baseFreq").toFixed(0)} Hz`;
            document.querySelector("#pitchAmountReadout").textContent = `${value("pitchAmount").toFixed(0)} Hz`;
            document.querySelector("#pitchDecayReadout").textContent = `${Math.round(value("pitchDecay") * 1000)} ms`;
            document.querySelector("#ampDecayReadout").textContent = `${Math.round(value("ampDecay") * 1000)} ms`;
            document.querySelector("#cutoffReadout").textContent = `${value("cutoff").toFixed(0)} Hz`;
            document.querySelector("#resonanceReadout").textContent = value("resonance").toFixed(2);
            document.querySelector("#gainReadout").textContent = value("gain").toFixed(2);
            els.tempoReadout.textContent = `${bpmFromRepeatMs()} BPM`;
        }

        function startRepeat() {
            triggerKick();
            state.repeatTimer = setInterval(triggerKick, state.repeatMs);
            els.repeat.textContent = "Repeating";
        }

        function restartRepeatIfRunning() {
            if(!state.repeatTimer) {
                return;
            }

            clearInterval(state.repeatTimer);
            state.repeatTimer = setInterval(triggerKick, state.repeatMs);
        }

        function renderMemoryReport() {
            const report = window.KICKI_MEMORY_REPORT;
            if(!report || !Array.isArray(report.regions)) {
                els.memoryGrid.textContent = "Run python tools/update_memory_report.py to generate memory usage.";
                return;
            }

            const generated = new Date(report.generatedAt);
            els.memoryTime.textContent = Number.isNaN(generated.getTime())
                ? report.target
                : generated.toLocaleString();

            els.memoryGrid.innerHTML = "";
            report.regions.forEach((region) => {
                const row = document.createElement("div");
                const name = document.createElement("div");
                const track = document.createElement("div");
                const fill = document.createElement("div");
                const value = document.createElement("div");

                row.className = "memory-row";
                name.className = "memory-name";
                track.className = "memory-track";
                fill.className = "memory-fill";
                value.className = "memory-value";

                if(region.percent >= 90) {
                    fill.classList.add("danger");
                } else if(region.percent >= 75) {
                    fill.classList.add("warning");
                }

                name.textContent = region.name;
                fill.style.width = `${Math.min(100, region.percent)}%`;
                value.textContent = `${region.used} / ${region.total} (${region.percent.toFixed(2)}%)`;

                track.appendChild(fill);
                row.append(name, track, value);
                els.memoryGrid.appendChild(row);
            });
        }

        async function triggerKick() {
            const audio = getAudio();
            await audio.resume();

            const now = audio.currentTime;
            const baseFreq = value("baseFreq");
            const startFreq = baseFreq + value("pitchAmount");
            const pitchDecay = value("pitchDecay");
            const ampDecay = value("ampDecay");
            const gain = value("gain");
            const resonance = value("resonance");

            const osc = audio.createOscillator();
            const filter = audio.createBiquadFilter();
            const amp = audio.createGain();

            osc.type = "sine";
            osc.frequency.setValueAtTime(startFreq, now);
            osc.frequency.exponentialRampToValueAtTime(Math.max(1, baseFreq), now + pitchDecay);

            filter.type = "lowpass";
            filter.frequency.setValueAtTime(value("cutoff"), now);
            filter.Q.setValueAtTime(0.5 + resonance * 12.0, now);

            amp.gain.setValueAtTime(0, now);
            amp.gain.linearRampToValueAtTime(gain, now + 0.002);
            amp.gain.exponentialRampToValueAtTime(0.0001, now + ampDecay);

            osc.connect(filter);
            filter.connect(amp);
            amp.connect(state.master);

            osc.start(now);
            osc.stop(now + ampDecay + 0.08);

            els.status.textContent = `Kick ${baseFreq.toFixed(0)} Hz, res ${resonance.toFixed(2)}`;
        }

        function toggleRepeat() {
            if(state.repeatTimer) {
                clearInterval(state.repeatTimer);
                state.repeatTimer = null;
                els.repeat.textContent = "Repeat";
                els.status.textContent = "Ready";
                return;
            }

            startRepeat();
        }

        function stopRepeat() {
            if(state.repeatTimer) {
                clearInterval(state.repeatTimer);
                state.repeatTimer = null;
            }
            els.repeat.textContent = "Repeat";
            els.status.textContent = "Ready";
        }

        function tapTempo() {
            const now = performance.now();
            const lastTap = state.tapTimes[state.tapTimes.length - 1];

            if(lastTap && now - lastTap > 2200) {
                state.tapTimes = [];
            }

            state.tapTimes.push(now);
            state.tapTimes = state.tapTimes.slice(-5);

            if(state.tapTimes.length >= 2) {
                const intervals = [];
                for(let i = 1; i < state.tapTimes.length; i++) {
                    intervals.push(state.tapTimes[i] - state.tapTimes[i - 1]);
                }

                const average = intervals.reduce((sum, interval) => sum + interval, 0) / intervals.length;
                setBpm(60000 / average, true, true);
            }

            triggerKick();
            els.status.textContent = `Tap tempo ${bpmFromRepeatMs()} BPM`;
        }

        Object.values(controls).forEach((control) => {
            control.addEventListener("input", () => {
                updateReadouts();
                updateFirmwareValues();
                saveSettings();
            });
        });

        controls.bpm.addEventListener("input", () => setBpm(value("bpm")));
        controls.bpmNumber.addEventListener("input", () => setBpm(value("bpmNumber")));

        els.trigger.addEventListener("click", triggerKick);
        els.repeat.addEventListener("click", toggleRepeat);
        els.tapTempo.addEventListener("click", tapTempo);
        els.printValues.addEventListener("click", printFirmwareValues);
        els.copyValues.addEventListener("click", copyFirmwareValues);
        els.stop.addEventListener("click", stopRepeat);

        loadSettings();
        updateReadouts();
        updateFirmwareValues();
        renderMemoryReport();
    </script>
</body>
</html>
